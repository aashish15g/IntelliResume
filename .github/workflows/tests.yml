name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-session-secret
      GEMINI_API_KEY: test-key
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check private-file exclusions
        run: python scripts/check_private_files.py
      - name: Initialize an empty database
        run: python -m flask --app run:flask_app db upgrade
      - name: Run backend regressions
        run: python -m unittest discover -s tests -v
      - name: Run frontend regressions
        run: node --test tests/frontend.test.cjs
